services:
  api:
    build: .
    container_name: apicolmena-api-local
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/apicolmena
      - JWT_SECRET=dev-secret-key
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:5173
      - BASE_URL=http://localhost:3001
      - FRONTEND_URL=http://localhost:5173
      - API_VERSION=v1
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    networks:
      - apicolmena-local

  db:
    image: postgres:16-alpine
    container_name: apicolmena-db-local
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=apicolmena
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apicolmena"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - apicolmena-local

volumes:
  postgres_local_data:

networks:
  apicolmena-local:
    driver: bridge